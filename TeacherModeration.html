<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teacher Admin Control Center</title>
  <link rel="shortcut icon" href="#">
  <style>
    :root {
      --primary: #0284c7;
      --bg-slate: #f8fafc;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --green: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-slate); color: var(--text-main); padding: 20px; }

    .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    header { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    .section-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }

    .tabs { display: flex; gap: 10px; margin-bottom: 16px; }
    .tab-btn { padding: 8px 16px; border: 1px solid var(--border); background: #fff; border-radius: 20px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
    .tab-btn.active { background: var(--text-main); color: #fff; }

    .list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .card.approved { border-left: 5px solid var(--green); }
    .card.pending { border-left: 5px solid #f59e0b; }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .badge { padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
    .badge-pending { background: #fef3c7; color: #92400e; }
    .badge-approved { background: #dcfce7; color: #166534; }

    .card-body { font-size: 0.95rem; color: #334155; line-height: 1.4; margin-bottom: 12px; white-space: pre-line; background: #f8fafc; padding: 10px; border-radius: 6px; }

    .actions { display: flex; gap: 8px; justify-content: flex-end; }
    .btn { padding: 8px 14px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-approve { background: var(--green); color: #fff; }
    .btn-delete { background: var(--red); color: #fff; }
    .btn-edit { background: #64748b; color: #fff; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: #fff; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .form-row { display: flex; gap: 12px; }
    .flex-1 { flex: 1; }
    input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🛡️ Teacher Admin Dashboard</h1>
    </header>

    <!-- MODULE 1: Post Announcements -->
    <div class="card">
      <div class="section-title">
        <span>📌 Manage Teacher Notices</span>
        <button class="btn btn-primary" onclick="openNoticeModal()">+ New Notice</button>
      </div>

      <div id="noticesContainer" class="list">
        <div style="text-align:center; padding: 20px; color: var(--text-muted);">Loading notices...</div>
      </div>
    </div>

    <!-- MODULE 2: Moderation for Student Messages -->
    <div class="card">
      <div class="section-title">💬 Student Messages & Complaints Moderation</div>

      <div class="tabs">
        <button class="tab-btn active" onclick="filterMessages('pending', this)">Pending Review (<span id="pendingCount">0</span>)</button>
        <button class="tab-btn" onclick="filterMessages('approved', this)">Approved Posts</button>
      </div>

      <div id="messagesContainer" class="list">
        <div style="text-align:center; padding: 20px; color: var(--text-muted);">Loading student messages...</div>
      </div>
    </div>
  </div>

  <!-- Modal for Creating/Editing Notices -->
  <div id="noticeModal" class="modal-backdrop" style="display: none;">
    <div class="modal">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 id="modalTitle">Post Announcement</h3>
        <button style="border:none; background:none; font-size: 1.2rem; cursor:pointer;" onclick="closeNoticeModal()">&times;</button>
      </div>
      <form id="noticeForm" onsubmit="handleSaveNotice(event)">
        <input type="hidden" id="noticeDocId" value="" />
        <div class="form-group">
          <label>Notice Title *</label>
          <input type="text" id="noticeTitle" required />
        </div>
        <div class="form-row">
          <div class="form-group flex-1">
            <label>Priority</label>
            <select id="noticePriority">
              <option value="Normal">Normal</option>
              <option value="Important"> Important</option>
              <option value="Urgent">🔴 Urgent</option>
            </select>
          </div>
          <div class="form-group flex-1">
            <label>Audience</label>
            <select id="noticeAudience">
              <option value="All">All Classes</option>
              <option value="Class 2">Class 2</option>
              <option value="Class 3">Class 3</option>
              <option value="Class 4">Class 4</option>
              <option value="Class 5">Class 5</option>
              <option value="Class 6">Class 6</option>
              <option value="Class 7">Class 7</option>
              <option value="Class 8">Class 8</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>Details *</label>
          <textarea id="noticeContent" rows="4" required></textarea>
        </div>
        <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
          <input type="checkbox" id="noticePinned" style="width: auto;" />
          <label style="margin: 0;">Pin to top</label>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px;">
          <button type="button" class="btn" style="background:#e2e8f0;" onclick="closeNoticeModal()">Cancel</button>
          <button type="submit" class="btn btn-primary">Publish</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

 const firebaseConfig = {
    apiKey: "AIzaSyDXmSQtFw9REVME-WEZvD4hxucxC1HNoFo",
    authDomain: "teacher-resource-hub.firebaseapp.com",
    projectId: "teacher-resource-hub",
    storageBucket: "teacher-resource-hub.firebasestorage.app",
    messagingSenderId: "331374983102",
    appId: "1:331374983102:web:af6c4fa75eece69cb66bef"
  };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let rawNotices = [];
    let allMessages = [];
    let currentMsgFilter = "pending";

    // 1. Manage Notices Stream
    onSnapshot(query(collection(db, "teacherNotices"), orderBy("createdAt", "desc")), (snapshot) => {
      rawNotices = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      renderAdminNotices();
    });

    function renderAdminNotices() {
      const container = document.getElementById("noticesContainer");
      if (rawNotices.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">No notices posted yet.</div>`;
        return;
      }

      container.innerHTML = rawNotices.map(item => `
        <div class="card" style="border-left: 4px solid var(--primary);">
          <div class="card-header">
            <strong>${escapeHtml(item.title)} (${item.targetAudience})</strong>
            <span>${item.isPinned ? '📌 Pinned' : ''}</span>
          </div>
          <div class="card-body">${escapeHtml(item.content)}</div>
          <div class="actions">
            <button class="btn btn-edit" onclick="editNotice('${item.id}')">✏️ Edit</button>
            <button class="btn btn-delete" onclick="deleteNotice('${item.id}')">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    // 2. Manage Student Messages Stream
    onSnapshot(query(collection(db, "studentMessages"), orderBy("createdAt", "desc")), (snapshot) => {
      allMessages = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      const pendingCount = allMessages.filter(m => m.status === 'pending').length;
      document.getElementById('pendingCount').innerText = pendingCount;
      renderAdminMessages();
    });

    function renderAdminMessages() {
      const container = document.getElementById("messagesContainer");
      const filtered = allMessages.filter(m => m.status === currentMsgFilter);

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted);">No ${currentMsgFilter} messages.</div>`;
        return;
      }

      container.innerHTML = filtered.map(msg => `
        <div class="card ${msg.status}">
          <div class="card-header">
            <strong>${escapeHtml(msg.studentName)} <span style="font-size:0.85rem; color:var(--text-muted);">(${escapeHtml(msg.class)})</span></strong>
            <span class="badge badge-${msg.status}">${msg.status}</span>
          </div>
          <div class="card-body">${escapeHtml(msg.message)}</div>
          <div class="actions">
            ${msg.status === 'pending' ? `<button class="btn btn-approve" onclick="approveMessage('${msg.id}')">✓ Approve & Publish</button>` : ''}
            <button class="btn btn-delete" onclick="deleteMessage('${msg.id}')">🗑️ Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Handlers
    window.filterMessages = (status, btn) => {
      currentMsgFilter = status;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAdminMessages();
    };

    window.approveMessage = async (id) => {
      await updateDoc(doc(db, "studentMessages", id), { status: "approved" });
    };

    window.deleteMessage = async (id) => {
      if (confirm("Delete this student message?")) await deleteDoc(doc(db, "studentMessages", id));
    };

    window.openNoticeModal = () => {
      document.getElementById("noticeForm").reset();
      document.getElementById("noticeDocId").value = "";
      document.getElementById("modalTitle").innerText = "Post Announcement";
      document.getElementById("noticeModal").style.display = "flex";
    };

    window.closeNoticeModal = () => document.getElementById("noticeModal").style.display = "none";

    window.handleSaveNotice = async (e) => {
      e.preventDefault();
      const docId = document.getElementById("noticeDocId").value;
      const data = {
        title: document.getElementById("noticeTitle").value.trim(),
        priority: document.getElementById("noticePriority").value,
        targetAudience: document.getElementById("noticeAudience").value,
        content: document.getElementById("noticeContent").value.trim(),
        isPinned: document.getElementById("noticePinned").checked,
        createdAt: serverTimestamp()
      };

      if (docId) {
        await updateDoc(doc(db, "teacherNotices", docId), data);
      } else {
        await addDoc(collection(db, "teacherNotices"), data);
      }
      closeNoticeModal();
    };

    window.editNotice = (id) => {
      const item = rawNotices.find(n => n.id === id);
      if (!item) return;
      document.getElementById("noticeDocId").value = item.id;
      document.getElementById("noticeTitle").value = item.title;
      document.getElementById("noticePriority").value = item.priority;
      document.getElementById("noticeAudience").value = item.targetAudience;
      document.getElementById("noticeContent").value = item.content;
      document.getElementById("noticePinned").checked = item.isPinned;
      document.getElementById("modalTitle").innerText = "Edit Announcement";
      document.getElementById("noticeModal").style.display = "flex";
    };

    window.deleteNotice = async (id) => {
      if (confirm("Delete this notice?")) await deleteDoc(doc(db, "teacherNotices", id));
    };

    function escapeHtml(str) { return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
