<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Dashboard — Lovely Angels</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f6f9;
    color: #1a1a1a;
    min-height: 100vh;
  }
  header {
    background: #0a1f44;
    color: #fff;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  header .brand { font-size: 0.95rem; }
  header .brand strong { color: #d4af37; }
  header .userinfo {
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 0.85rem;
  }
  header button {
    background: transparent;
    border: 1px solid #d4af37;
    color: #d4af37;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  header button:hover { background: #d4af37; color: #0a1f44; }

  main { max-width: 900px; margin: 24px auto; padding: 0 16px 60px; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .top-bar h1 { font-size: 1.3rem; color: #0a1f44; }

  .btn {
    background: #0a1f44;
    color: #fff;
    border: none;
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #12305f; }
  .btn.gold { background: #d4af37; color: #0a1f44; }
  .btn.gold:hover { background: #c29d2e; }
  .btn.danger { background: #b3261e; }
  .btn.danger:hover { background: #8f1e18; }
  .btn.small { padding: 5px 10px; font-size: 0.75rem; border-radius: 6px; }
  .btn.ghost { background: transparent; color: #0a1f44; border: 1px solid #ccc; }
  .btn.ghost:hover { background: #eee; }

  .card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .grade-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    cursor: pointer;
    background: #fff;
  }
  .grade-header:hover { background: #f9fafb; }
  .grade-header .title {
    font-weight: 700;
    color: #0a1f44;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .arrow { transition: transform 0.15s; display: inline-block; }
  .arrow.open { transform: rotate(90deg); }

  .grade-body {
    display: none;
    padding: 0 16px 16px 30px;
    border-top: 1px solid #eee;
  }
  .grade-body.open { display: block; }

  .subject-block { margin-top: 12px; }
  .subject-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 12px;
    background: #f4f6f9;
    border-radius: 8px;
    cursor: pointer;
  }
  .subject-header .title {
    font-weight: 600;
    color: #12305f;
    font-size: 0.92rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .subject-body {
    display: none;
    padding: 10px 6px 6px 24px;
  }
  .subject-body.open { display: block; }

  .unit-block { border-bottom: 1px solid #f0f0f0; }
  .unit-block:last-child { border-bottom: none; }
  .unit-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    font-size: 0.88rem;
    cursor: pointer;
  }
  .unit-header:hover { background: #fafafa; }
  .unit-header .title { color: #333; display: flex; align-items: center; gap: 8px; }
  .unit-body {
    display: none;
    padding: 4px 10px 12px 26px;
  }
  .unit-body.open { display: block; }

  .file-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 10px;
    background: #f9fafb;
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 0.83rem;
  }
  .file-row .title { display: flex; align-items: center; gap: 8px; }
  .file-badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  .file-badge.pdf { background: #fde3e3; color: #b3261e; }
  .file-badge.docx { background: #dbeafe; color: #1e40af; }
  .file-badge.pptx { background: #fde8cc; color: #9a5b00; }
  .file-badge.image { background: #e6f4ea; color: #1e7e34; }
  .file-badge.zip { background: #ede9fe; color: #5b21b6; }
  .file-badge.video { background: #fde3ea; color: #9d174d; }
  .file-row a { color: #12305f; text-decoration: none; }
  .file-row a:hover { text-decoration: underline; }

  .add-file-form {
    margin-top: 8px;
    padding: 10px;
    background: #f4f6f9;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .add-file-form .row2 { display: flex; gap: 6px; }
  .add-file-form input, .add-file-form select {
    padding: 7px 9px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.83rem;
  }
  .add-file-form select { flex: 0 0 120px; }
  .add-file-form input.grow { flex: 1; }
  .hint { font-size: 0.72rem; color: #888; }

  .actions { display: flex; gap: 6px; }

  .add-row {
    margin-top: 8px;
    display: flex;
    gap: 6px;
  }
  .add-row input {
    flex: 1;
    padding: 7px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.85rem;
  }

  .empty-msg {
    color: #999;
    font-size: 0.85rem;
    padding: 10px 0;
    font-style: italic;
  }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: 10px;
    padding: 24px;
    width: 90%;
    max-width: 360px;
  }
  .modal h2 { font-size: 1.05rem; color: #0a1f44; margin-bottom: 14px; }
  .modal input {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-bottom: 14px;
    font-size: 0.9rem;
  }
  .modal .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }

  .status {
    text-align: center;
    padding: 60px 20px;
    color: #666;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #0a1f44;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 0.85rem;
    display: none;
    z-index: 100;
  }
  .toast.error { background: #b3261e; }
</style>
</head>
<body>

<header>
  <div class="brand">Lovely Angels <strong>Teacher Portal</strong></div>
  <div class="userinfo">
    <span id="userLabel">Loading...</span>
    <button id="signOutBtn">Sign Out</button>
  </div>
</header>

<main>
  <div id="authGate" class="status">Checking your session...</div>

  <div id="dashboardRoot" style="display:none;">
    <div class="top-bar">
      <h1>Grades</h1>
      <button class="btn gold" id="addGradeBtn">+ Add Grade</button>
    </div>
    <div id="gradesList"></div>
    <div id="noGrades" class="empty-msg" style="display:none;">No grades yet. Click "Add Grade" to create your first class.</div>
  </div>
</main>

<!-- Generic prompt modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add</h2>
    <input type="text" id="modalInput" placeholder="Name">
    <div id="modalIdWrap" style="display:none;">
      <label style="display:block;font-size:0.78rem;color:#555;margin-bottom:4px;">
        Document ID (used internally, e.g. for bulk student import matching)
      </label>
      <input type="text" id="modalIdInput" placeholder="e.g. grade5">
    </div>
    <div class="modal-actions">
      <button class="btn ghost small" id="modalCancel">Cancel</button>
      <button class="btn small" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import {
    getFirestore, collection, doc, addDoc, setDoc, updateDoc, deleteDoc,
    getDocs, getDoc, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXmSQtFw9REVME-WEZvD4hxucxC1HNoFo",
    authDomain: "teacher-resource-hub.firebaseapp.com",
    projectId: "teacher-resource-hub",
    storageBucket: "teacher-resource-hub.firebasestorage.app",
    messagingSenderId: "331374983102",
    appId: "1:331374983102:web:af6c4fa75eece69cb66bef"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const authGate = document.getElementById("authGate");
  const dashboardRoot = document.getElementById("dashboardRoot");
  const userLabel = document.getElementById("userLabel");
  const gradesList = document.getElementById("gradesList");
  const noGrades = document.getElementById("noGrades");
  const toast = document.getElementById("toast");

  let currentUid = null;

  function showToast(msg, isError) {
    toast.textContent = msg;
    toast.className = "toast" + (isError ? " error" : "");
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  // ---------- Auth guard ----------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    currentUid = user.uid;
    try {
      const userDocSnap = await getDoc(doc(db, "users", user.uid));
      if (!userDocSnap.exists() || !["teacher", "admin"].includes(userDocSnap.data().role)) {
        authGate.textContent = "Access denied — this account is not a teacher/admin.";
        return;
      }
      userLabel.textContent = userDocSnap.data().name + " (" + userDocSnap.data().role + ")";
      authGate.style.display = "none";
      dashboardRoot.style.display = "block";
      loadGrades();
    } catch (err) {
      authGate.textContent = "Error loading profile: " + err.message;
    }
  });

  document.getElementById("signOutBtn").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "login.html";
  });

  // ---------- Generic modal for add/rename ----------
  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalInput = document.getElementById("modalInput");
  const modalIdWrap = document.getElementById("modalIdWrap");
  const modalIdInput = document.getElementById("modalIdInput");
  const modalSave = document.getElementById("modalSave");
  const modalCancel = document.getElementById("modalCancel");
  let modalResolve = null;
  let modalWantsId = false;

  function slugify(str) {
    return str.toLowerCase().trim().replace(/[^a-z0-9]+/g, "");
  }

  // withId=true returns {name, id}; withId=false returns just the string (old behavior)
  function promptModal(title, defaultValue, withId) {
    modalTitle.textContent = title;
    modalInput.value = defaultValue || "";
    modalWantsId = !!withId;
    modalIdWrap.style.display = withId ? "block" : "none";
    modalIdInput.value = "";
    modalOverlay.classList.add("open");
    modalInput.focus();
    return new Promise((resolve) => { modalResolve = resolve; });
  }

  // Auto-suggest an ID as the user types the name, when the ID field is visible
  modalInput.addEventListener("input", () => {
    if (modalWantsId && !modalIdInput.dataset.edited) {
      modalIdInput.value = slugify(modalInput.value);
    }
  });
  modalIdInput.addEventListener("input", () => {
    modalIdInput.dataset.edited = "true";
  });

  modalSave.addEventListener("click", () => {
    const val = modalInput.value.trim();
    const idVal = slugify(modalIdInput.value);
    modalOverlay.classList.remove("open");
    modalIdInput.dataset.edited = "";
    if (modalResolve) {
      if (modalWantsId) {
        if (!val || !idVal) { modalResolve(null); return; }
        modalResolve({ name: val, id: idVal });
      } else {
        modalResolve(val || null);
      }
    }
  });
  modalCancel.addEventListener("click", () => {
    modalOverlay.classList.remove("open");
    modalIdInput.dataset.edited = "";
    if (modalResolve) modalResolve(null);
  });

  // ---------- Load & render Grades → Subjects → Units ----------
  async function loadGrades() {
    gradesList.innerHTML = "";
    const snap = await getDocs(query(collection(db, "grades"), orderBy("order")));
    if (snap.empty) {
      noGrades.style.display = "block";
      return;
    }
    noGrades.style.display = "none";
    snap.forEach((gradeDoc) => renderGradeCard(gradeDoc.id, gradeDoc.data()));
  }

  function renderGradeCard(gradeId, gradeData) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="grade-header">
        <div class="title"><span class="arrow">▶</span> ${escapeHtml(gradeData.name)}</div>
        <div class="actions">
          <button class="btn small ghost" data-action="rename-grade">Rename</button>
          <button class="btn small danger" data-action="delete-grade">Delete</button>
        </div>
      </div>
      <div class="grade-body">
        <div class="subjectsContainer"></div>
        <div class="add-row">
          <input type="text" class="newSubjectInput" placeholder="New subject name (e.g. Computer)">
          <button class="btn small gold" data-action="add-subject">+ Add Subject</button>
        </div>
      </div>
    `;
    gradesList.appendChild(card);

    const header = card.querySelector(".grade-header");
    const body = card.querySelector(".grade-body");
    const arrow = card.querySelector(".arrow");
    let subjectsLoaded = false;

    header.addEventListener("click", async (e) => {
      if (e.target.closest("button")) return;
      const isOpen = body.classList.toggle("open");
      arrow.classList.toggle("open", isOpen);
      if (isOpen && !subjectsLoaded) {
        subjectsLoaded = true;
        await loadSubjects(gradeId, card.querySelector(".subjectsContainer"));
      }
    });

    card.querySelector('[data-action="rename-grade"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const newName = await promptModal("Rename Grade", gradeData.name);
      if (newName) {
        await updateDoc(doc(db, "grades", gradeId), { name: newName });
        showToast("Grade renamed");
        loadGrades();
      }
    });

    card.querySelector('[data-action="delete-grade"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${gradeData.name}" and everything inside it? This cannot be undone.`)) {
        await deleteDoc(doc(db, "grades", gradeId));
        showToast("Grade deleted");
        loadGrades();
      }
    });

    card.querySelector('[data-action="add-subject"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const input = card.querySelector(".newSubjectInput");
      const name = input.value.trim();
      if (!name) return;
      const subjSnap = await getDocs(collection(db, "grades", gradeId, "subjects"));
      await addDoc(collection(db, "grades", gradeId, "subjects"), {
        name, order: subjSnap.size
      });
      input.value = "";
      showToast("Subject added");
      subjectsLoaded = false;
      body.classList.add("open");
      arrow.classList.add("open");
      subjectsLoaded = true;
      await loadSubjects(gradeId, card.querySelector(".subjectsContainer"));
    });
  }

  async function loadSubjects(gradeId, container) {
    container.innerHTML = "";
    const snap = await getDocs(query(collection(db, "grades", gradeId, "subjects"), orderBy("order")));
    if (snap.empty) {
      container.innerHTML = '<div class="empty-msg">No subjects yet.</div>';
      return;
    }
    snap.forEach((subjDoc) => renderSubjectBlock(gradeId, subjDoc.id, subjDoc.data(), container));
  }

  function renderSubjectBlock(gradeId, subjectId, subjectData, container) {
    const block = document.createElement("div");
    block.className = "subject-block";
    block.innerHTML = `
      <div class="subject-header">
        <div class="title"><span class="arrow">▶</span> ${escapeHtml(subjectData.name)}</div>
        <div class="actions">
          <button class="btn small ghost" data-action="rename-subject">Rename</button>
          <button class="btn small danger" data-action="delete-subject">Delete</button>
        </div>
      </div>
      <div class="subject-body">
        <div class="unitsContainer"></div>
        <div class="add-row">
          <input type="text" class="newUnitInput" placeholder="New unit title (e.g. Unit 1: Computer Fundamentals)">
          <button class="btn small gold" data-action="add-unit">+ Add Unit</button>
        </div>
      </div>
    `;
    container.appendChild(block);

    const header = block.querySelector(".subject-header");
    const body = block.querySelector(".subject-body");
    const arrow = block.querySelector(".arrow");
    let unitsLoaded = false;

    header.addEventListener("click", async (e) => {
      if (e.target.closest("button")) return;
      const isOpen = body.classList.toggle("open");
      arrow.classList.toggle("open", isOpen);
      if (isOpen && !unitsLoaded) {
        unitsLoaded = true;
        await loadUnits(gradeId, subjectId, block.querySelector(".unitsContainer"));
      }
    });

    block.querySelector('[data-action="rename-subject"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const newName = await promptModal("Rename Subject", subjectData.name);
      if (newName) {
        await updateDoc(doc(db, "grades", gradeId, "subjects", subjectId), { name: newName });
        showToast("Subject renamed");
        loadSubjects(gradeId, container);
      }
    });

    block.querySelector('[data-action="delete-subject"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      if (confirm(`Delete "${subjectData.name}" and everything inside it?`)) {
        await deleteDoc(doc(db, "grades", gradeId, "subjects", subjectId));
        showToast("Subject deleted");
        loadSubjects(gradeId, container);
      }
    });

    block.querySelector('[data-action="add-unit"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const input = block.querySelector(".newUnitInput");
      const title = input.value.trim();
      if (!title) return;
      const unitSnap = await getDocs(collection(db, "grades", gradeId, "subjects", subjectId, "units"));
      await addDoc(collection(db, "grades", gradeId, "subjects", subjectId, "units"), {
        title, description: "", order: unitSnap.size,
        createdAt: serverTimestamp(), updatedAt: serverTimestamp()
      });
      input.value = "";
      showToast("Unit added");
      body.classList.add("open");
      arrow.classList.add("open");
      unitsLoaded = true;
      await loadUnits(gradeId, subjectId, block.querySelector(".unitsContainer"));
    });
  }

  async function loadUnits(gradeId, subjectId, container) {
    container.innerHTML = "";
    const snap = await getDocs(query(collection(db, "grades", gradeId, "subjects", subjectId, "units"), orderBy("order")));
    if (snap.empty) {
      container.innerHTML = '<div class="empty-msg">No units yet.</div>';
      return;
    }
    snap.forEach((unitDoc) => renderUnitBlock(gradeId, subjectId, unitDoc.id, unitDoc.data(), container));
  }

  function renderUnitBlock(gradeId, subjectId, unitId, unitData, container) {
    const block = document.createElement("div");
    block.className = "unit-block";
    block.innerHTML = `
      <div class="unit-header">
        <div class="title"><span class="arrow">▶</span> ${escapeHtml(unitData.title)}</div>
        <div class="actions">
          <button class="btn small ghost" data-action="rename-unit">Rename</button>
          <button class="btn small danger" data-action="delete-unit">Delete</button>
        </div>
      </div>
      <div class="unit-body">
        <div class="filesContainer"></div>
        <div class="add-file-form">
          <input type="text" class="newFileTitle grow" placeholder="File title (e.g. Notes.pdf)">
          <div class="row2">
            <select class="newFileType">
              <option value="pdf">PDF</option>
              <option value="docx">DOCX</option>
              <option value="pptx">PPTX</option>
              <option value="image">Image</option>
              <option value="zip">ZIP</option>
              <option value="video">Video</option>
            </select>
            <input type="text" class="newFileLink grow" placeholder="Paste Google Drive share link (or YouTube link for video)">
          </div>
          <div class="hint">For Drive files: set sharing to "Anyone with the link can view" first. The app converts the link automatically.</div>
          <button class="btn small gold" data-action="add-file" style="align-self:flex-start;">+ Add File</button>
        </div>
      </div>
    `;
    container.appendChild(block);

    const header = block.querySelector(".unit-header");
    const body = block.querySelector(".unit-body");
    const arrow = block.querySelector(".arrow");
    let filesLoaded = false;

    header.addEventListener("click", async (e) => {
      if (e.target.closest("button") || e.target.closest(".add-file-form")) return;
      const isOpen = body.classList.toggle("open");
      arrow.classList.toggle("open", isOpen);
      if (isOpen && !filesLoaded) {
        filesLoaded = true;
        await loadFiles(gradeId, subjectId, unitId, block.querySelector(".filesContainer"));
      }
    });

    block.querySelector('[data-action="rename-unit"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const newTitle = await promptModal("Rename Unit", unitData.title);
      if (newTitle) {
        await updateDoc(doc(db, "grades", gradeId, "subjects", subjectId, "units", unitId), {
          title: newTitle, updatedAt: serverTimestamp()
        });
        showToast("Unit renamed");
        loadUnits(gradeId, subjectId, container);
      }
    });

    block.querySelector('[data-action="delete-unit"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const fileSnap = await getDocs(collection(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files"));
      const warn = fileSnap.empty ? "" : ` It contains ${fileSnap.size} file(s) which will also be deleted.`;
      if (confirm(`Delete unit "${unitData.title}"?${warn}`)) {
        // Cascade delete files first (Firestore doesn't cascade automatically)
        for (const f of fileSnap.docs) {
          await deleteDoc(doc(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files", f.id));
        }
        await deleteDoc(doc(db, "grades", gradeId, "subjects", subjectId, "units", unitId));
        showToast("Unit and its files deleted");
        loadUnits(gradeId, subjectId, container);
      }
    });

    block.querySelector('[data-action="add-file"]').addEventListener("click", async (e) => {
      e.stopPropagation();
      const titleInput = block.querySelector(".newFileTitle");
      const typeSelect = block.querySelector(".newFileType");
      const linkInput = block.querySelector(".newFileLink");
      const title = titleInput.value.trim();
      const fileType = typeSelect.value;
      const rawLink = linkInput.value.trim();
      if (!title || !rawLink) {
        showToast("Please enter both a title and a link", true);
        return;
      }
      const finalLink = fileType === "video" ? rawLink : normalizeDriveLink(rawLink);
      if (fileType !== "video" && !finalLink) {
        showToast("That doesn't look like a valid Google Drive link", true);
        return;
      }
      const fileSnap = await getDocs(collection(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files"));
      await addDoc(collection(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files"), {
        title, fileType, driveLink: finalLink,
        uploadedBy: currentUid, uploadedAt: serverTimestamp(), lastUpdated: serverTimestamp(),
        order: fileSnap.size
      });
      titleInput.value = "";
      linkInput.value = "";
      showToast("File added");
      filesLoaded = true;
      await loadFiles(gradeId, subjectId, unitId, block.querySelector(".filesContainer"));
    });
  }

  // Converts a Google Drive share link into the embeddable preview URL.
  // Accepts formats like:
  //   https://drive.google.com/file/d/FILE_ID/view?usp=sharing
  //   https://drive.google.com/open?id=FILE_ID
  function normalizeDriveLink(rawLink) {
    let fileId = null;
    const m1 = rawLink.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (m1) fileId = m1[1];
    if (!fileId) {
      const m2 = rawLink.match(/[?&]id=([a-zA-Z0-9_-]+)/);
      if (m2) fileId = m2[1];
    }
    if (!fileId) return null;
    return `https://drive.google.com/file/d/${fileId}/preview`;
  }

  async function loadFiles(gradeId, subjectId, unitId, container) {
    container.innerHTML = "";
    const snap = await getDocs(query(
      collection(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files"),
      orderBy("order")
    ));
    if (snap.empty) {
      container.innerHTML = '<div class="empty-msg">No files yet.</div>';
      return;
    }
    snap.forEach((fileDoc) => {
      const f = fileDoc.data();
      const row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML = `
        <div class="title">
          <span class="file-badge ${f.fileType}">${f.fileType}</span>
          <a href="${f.driveLink}" target="_blank" rel="noopener">${escapeHtml(f.title)}</a>
        </div>
        <div class="actions">
          <button class="btn small ghost" data-action="edit-file">Edit</button>
          <button class="btn small danger" data-action="delete-file">Delete</button>
        </div>
      `;
      container.appendChild(row);

      row.querySelector('[data-action="edit-file"]').addEventListener("click", async () => {
        const newTitle = await promptModal("Rename File", f.title);
        if (newTitle) {
          await updateDoc(
            doc(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files", fileDoc.id),
            { title: newTitle, lastUpdated: serverTimestamp() }
          );
          showToast("File renamed");
          loadFiles(gradeId, subjectId, unitId, container);
        }
      });

      row.querySelector('[data-action="delete-file"]').addEventListener("click", async () => {
        if (confirm(`Delete "${f.title}"? This only removes it from the portal, not from Google Drive.`)) {
          await deleteDoc(doc(db, "grades", gradeId, "subjects", subjectId, "units", unitId, "files", fileDoc.id));
          showToast("File deleted");
          loadFiles(gradeId, subjectId, unitId, container);
        }
      });
    });
  }

  // ---------- Add Grade ----------
  document.getElementById("addGradeBtn").addEventListener("click", async () => {
    const result = await promptModal("Add Grade", "", true);
    if (!result) return;
    const { name, id } = result;
    const existing = await getDoc(doc(db, "grades", id));
    if (existing.exists()) {
      showToast(`A grade with ID "${id}" already exists. Choose a different name.`, true);
      return;
    }
    const snap = await getDocs(collection(db, "grades"));
    await setDoc(doc(db, "grades", id), { name, order: snap.size });
    showToast(`Grade added (ID: ${id})`);
    loadGrades();
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
