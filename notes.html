<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes & Resources | Lovely Angels English Boarding School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-green:#1F3B33; --chalk-green-dark:#152A25;
    --paper:#F4F1E6; --paper-line:#DCD6C2;
    --margin-red:#C1443B; --ink:#26302C; --ink-soft:#5B6660;
    --mustard:#C99A1E; --teal:#2C7A73; --radius:10px;
    --shadow:0 6px 18px rgba(21,42,37,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif;}
  h1,h2,h3{font-family:'Fraunces',serif; font-weight:600; margin:0 0 6px;}
  .hand{font-family:'Caveat',cursive; color:var(--margin-red); font-weight:700;}
  :focus-visible{outline:3px solid var(--teal); outline-offset:2px;}

  nav.main{background:var(--chalk-green); color:#F4F1E6; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  nav.main .brand{font-family:'Fraunces',serif; font-size:1.2rem; font-weight:700; color:#F4F1E6; text-decoration:none;}

  main{max-width:900px; margin:0 auto; padding:28px 20px 60px;}
  .intro{text-align:center; margin-bottom:24px;}
  .intro p{color:var(--ink-soft); font-size:0.9rem;}

  .crumbs{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; font-size:0.85rem;}
  .crumbs button{background:none; border:none; color:var(--teal); font-weight:600; cursor:pointer; padding:0; font-size:0.85rem;}
  .crumbs button:hover{text-decoration:underline;}
  .crumbs span{color:var(--ink-soft);}

  .list{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px;}
  .tile{
    background:#fff; border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px; cursor:pointer; border:none; text-align:left; font-family:inherit;
  }
  .tile:hover{outline:2px solid var(--teal);}
  .tile h3{font-size:1.05rem; margin-bottom:2px;}
  .tile .sub{font-size:0.8rem; color:var(--ink-soft);}

  .file-card{
    background:#FFFDF7; border-left:4px solid var(--margin-red); border-radius:8px;
    padding:14px 16px; margin-bottom:12px; box-shadow:0 2px 8px rgba(21,42,37,0.08);
  }
  .file-card h3{font-size:1rem; margin-bottom:4px;}
  .file-card p{font-size:0.85rem; color:var(--ink-soft); margin:0 0 10px;}
  .file-card a{
    display:inline-block; font-size:0.85rem; font-weight:600; text-decoration:none;
    padding:7px 14px; border-radius:6px; background:var(--chalk-green); color:#fff;
  }
  .file-card a:hover{background:var(--chalk-green-dark);}

  .empty{ text-align:center; color:var(--ink-soft); padding:40px 10px; }
  .loading{ text-align:center; color:var(--ink-soft); padding:40px 10px; }

  [hidden]{display:none !important;}
</style>
</head>
<body>

<nav class="main">
  <a class="brand" href="index.html">LovelyAngels — Notes &amp; Resources</a>
</nav>

<main>
  <div class="intro">
    <span class="hand">no login needed —</span>
    <h1>Browse your class notes</h1>
    <p>Pick your grade, then subject, then unit, to find files your teacher has shared.</p>
  </div>

  <div class="crumbs" id="crumbs"></div>
  <div id="content"><div class="loading">Loading grades…</div></div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* PASTE the SAME firebaseConfig used in your dashboard.html */
 const firebaseConfig = {
    apiKey: "AIzaSyDXmSQtFw9REVME-WEZvD4hxucxC1HNoFo",
    authDomain: "teacher-resource-hub.firebaseapp.com",
    projectId: "teacher-resource-hub",
    storageBucket: "teacher-resource-hub.firebasestorage.app",
    messagingSenderId: "331374983102",
    appId: "1:331374983102:web:af6c4fa75eece69cb66bef"
  };
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const content = document.getElementById('content');
const crumbsEl = document.getElementById('crumbs');

// path = [] means grades list; [gradeId, gradeName] means subjects; etc.
let path = [];

function renderCrumbs(){
  const labels = ['All grades', ...path.filter((_,i) => i % 2 === 1)];
  crumbsEl.innerHTML = labels.map((label, i) => {
    const isLast = i === labels.length - 1;
    return (i>0 ? '<span>›</span>' : '') +
      (isLast ? `<span>${escapeHtml(label)}</span>` : `<button data-crumb="${i}">${escapeHtml(label)}</button>`);
  }).join('');
  crumbsEl.querySelectorAll('[data-crumb]').forEach(btn => {
    btn.addEventListener('click', () => {
      const level = parseInt(btn.dataset.crumb);
      path = path.slice(0, level * 2);
      route();
    });
  });
}

function route(){
  renderCrumbs();
  if(path.length === 0) loadGrades();
  else if(path.length === 2) loadSubjects(path[0]);
  else if(path.length === 4) loadUnits(path[0], path[2]);
  else if(path.length === 6) loadFiles(path[0], path[2], path[4]);
}

function loadGrades(){
  content.innerHTML = '<div class="loading">Loading grades…</div>';
  db.collection('grades').get().then(snap => {
    if(snap.empty){ content.innerHTML = '<div class="empty">No grades published yet.</div>'; return; }
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTiles(items, item => { path = [item.id, item.name || item.id]; route(); }, 'name');
  }).catch(err => showError(err));
}

function loadSubjects(gradeId){
  content.innerHTML = '<div class="loading">Loading subjects…</div>';
  db.collection('grades').doc(gradeId).collection('subjects').get().then(snap => {
    if(snap.empty){ content.innerHTML = '<div class="empty">No subjects yet for this grade.</div>'; return; }
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTiles(items, item => { path = [...path, item.id, item.name || item.id]; route(); }, 'name');
  }).catch(err => showError(err));
}

function loadUnits(gradeId, subjectId){
  content.innerHTML = '<div class="loading">Loading units…</div>';
  db.collection('grades').doc(gradeId).collection('subjects').doc(subjectId).collection('units').get().then(snap => {
    if(snap.empty){ content.innerHTML = '<div class="empty">No units yet for this subject.</div>'; return; }
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderTiles(items, item => { path = [...path, item.id, item.name || item.id]; route(); }, 'name');
  }).catch(err => showError(err));
}

function loadFiles(gradeId, subjectId, unitId){
  content.innerHTML = '<div class="loading">Loading files…</div>';
  db.collection('grades').doc(gradeId).collection('subjects').doc(subjectId)
    .collection('units').doc(unitId).collection('files').get().then(snap => {
    if(snap.empty){ content.innerHTML = '<div class="empty">No files uploaded here yet.</div>'; return; }
    const items = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    content.innerHTML = items.map(f => `
      <div class="file-card">
        <h3>${escapeHtml(f.title || f.name || 'Untitled file')}</h3>
        ${f.description ? '<p>'+escapeHtml(f.description)+'</p>' : ''}
        <a href="${escapeAttr(f.driveLink || f.url || '#')}" target="_blank" rel="noopener">Open</a>
      </div>
    `).join('');
  }).catch(err => showError(err));
}

function renderTiles(items, onClick, labelField){
  const wrap = document.createElement('div');
  wrap.className = 'list';
  items.forEach(item => {
    const btn = document.createElement('button');
    btn.className = 'tile';
    btn.innerHTML = `<h3>${escapeHtml(item[labelField] || item.id)}</h3><div class="sub">Tap to open</div>`;
    btn.addEventListener('click', () => onClick(item));
    wrap.appendChild(btn);
  });
  content.innerHTML = '';
  content.appendChild(wrap);
}

function showError(err){
  content.innerHTML = '<div class="empty">' + escapeHtml(err.message) +
    (err.message.includes('index') ? ' — check the browser console (F12) for a link to create it.' : '') +
    '</div>';
  console.error(err);
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function escapeAttr(str){ return escapeHtml(str).replace(/"/g,'&quot;'); }

route();
</script>
</body>
</html>
